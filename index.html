<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Medieval Crossy Road - Multiplayer Edition</title>
    <!-- MQTT over WebSockets - Funcționează garantat pe Incognito, rețele diferite și orice calculator -->
    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <style>
        :root {
            --medieval-gold: #facc15;
            --medieval-gold-dark: #b45309;
            --panel-bg: rgba(15, 23, 42, 0.94);
            --card-bg: rgba(30, 41, 59, 0.9);
            --border-color: rgba(250, 204, 21, 0.35);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at top, #1e1b4b, #09090b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', 'Segoe UI', system-ui, -apple-system, serif;
            color: var(--text-light);
            overflow: hidden;
        }

        #app-wrapper {
            position: relative;
            width: 580px;
            height: 760px;
            max-width: 100vw;
            max-height: 100vh;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #78350f;
            background: #14532d;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD IN-GAME */
        #hud-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
        }

        .hud-badge-left {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(15, 23, 42, 0.88);
            border: 2px solid var(--medieval-gold);
            border-radius: 10px;
            padding: 8px 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .hud-score-text {
            font-size: 24px;
            font-weight: 900;
            color: var(--medieval-gold);
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
        }

        .hud-biome-name {
            font-size: 11px;
            color: #e2e8f0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-leaderboard {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 205px;
            background: rgba(15, 23, 42, 0.88);
            border: 2px solid rgba(250, 204, 21, 0.4);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .hud-lb-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--medieval-gold);
            font-weight: 800;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 3px;
        }

        .hud-lb-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            font-weight: 700;
        }

        .hud-lb-row.dead {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .hud-lb-name {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 145px;
        }

        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
            border: 1px solid rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }

        /* Banner Eveniment Global */
        #event-banner {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(120, 53, 15, 0.95);
            border: 2px solid var(--medieval-gold);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            display: none;
            text-align: center;
            animation: pulseBanner 1s infinite alternate;
        }

        @keyframes pulseBanner {
            from { transform: translateX(-50%) scale(0.96); }
            to { transform: translateX(-50%) scale(1.04); }
        }

        /* Spectator Bar */
        #spectator-bar {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--medieval-gold);
            padding: 10px 18px;
            border-radius: 12px;
            text-align: center;
            pointer-events: auto;
            display: none;
            width: 90%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }

        #spectator-bar h4 {
            color: #ef4444;
            font-size: 14px;
            margin-bottom: 4px;
        }

        #spectator-bar p {
            font-size: 13px;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .btn-mini {
            background: #334155;
            color: #fff;
            border: 1px solid #64748b;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-mini:hover {
            background: #475569;
        }

        /* D-Pad pentru Mobil */
        #dpad-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .dpad-btn {
            width: 54px;
            height: 54px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid var(--border-color);
            color: var(--medieval-gold);
            font-size: 22px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
            transition: transform 0.08s;
        }

        .dpad-btn:active {
            transform: translateY(3px);
            background: rgba(250, 204, 21, 0.3);
        }

        /* ECRANE OVERLAY (Meniu, Lobby, Podium) */
        .screen-overlay {
            position: absolute;
            inset: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            z-index: 20;
            overflow-y: auto;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--medieval-gold);
            text-shadow: 0 3px 0 #78350f, 0 6px 18px rgba(0,0,0,0.7);
        }

        .brand-subtitle {
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 3px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--medieval-gold);
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #09090b;
            border: 2px solid #475569;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--medieval-gold);
        }

        /* Selector Eroi Medievali */
        .skin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .skin-option {
            background: #09090b;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.15s;
        }

        .skin-option.active {
            border-color: var(--medieval-gold);
            background: rgba(250, 204, 21, 0.15);
        }

        .skin-preview {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            position: relative;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.5);
        }

        /* Butoane */
        .btn {
            width: 100%;
            padding: 13px 18px;
            font-size: 15px;
            font-weight: 900;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            transition: transform 0.1s, filter 0.15s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .btn:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .btn:active:not(:disabled) {
            transform: translateY(3px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-gold {
            background: linear-gradient(180deg, #facc15, #ca8a04);
            color: #0f172a;
            box-shadow: 0 4px 0 #854d0e;
        }

        .btn-blue {
            background: linear-gradient(180deg, #3b82f6, #1d4ed8);
            box-shadow: 0 4px 0 #1e3a8a;
        }

        .btn-slate {
            background: #334155;
            box-shadow: 0 4px 0 #1e293b;
        }

        .btn-red {
            background: linear-gradient(180deg, #ef4444, #b91c1c);
            box-shadow: 0 4px 0 #7f1d1d;
        }

        /* Banner Cod Lobby */
        .lobby-code-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #09090b;
            border: 2px dashed var(--medieval-gold);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
        }

        .code-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            color
